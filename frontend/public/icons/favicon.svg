<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mashahir Ayandeh app icon: open book + rising star.
       The tab icon follows the system theme in Safari/Chrome through an
       embedded prefers-color-scheme query (media attributes on link[rel=icon]
       are still ignored there). -->
  <style>
    .bg { fill: url(#bgLight); }
    .page { fill: #FFFFFF; }
    .page-soft { fill: #FFFFFF; opacity: 0.94; }
    .spine { fill: #B9CCF1; }
    .star { fill: #F4B740; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#bgDark); }
      .page { fill: #E8EFFB; }
      .page-soft { fill: #E8EFFB; opacity: 0.92; }
      .spine { fill: #7D96C4; }
      .star { fill: #F2B84A; }
    }
  </style>
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B66DE"/>
      <stop offset="1" stop-color="#173E96"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B49"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="512" height="512" rx="112"/>
  <!-- open book -->
  <path class="page-soft" d="M96 340 C96 328 104 322 116 322 L232 322 C244 322 256 330 256 344 C256 330 268 322 280 322 L396 322 C408 322 416 328 416 340 L416 380 C416 390 408 396 398 396 L280 396 C268 396 256 388 256 376 C256 388 244 396 232 396 L114 396 C104 396 96 390 96 380 Z"/>
  <path class="page" d="M116 306 L232 306 C244 306 256 314 256 328 C256 314 268 306 280 306 L396 306 L396 154 C396 142 388 136 378 136 L280 136 C268 136 256 144 256 158 C256 144 244 136 232 136 L134 136 C124 136 116 142 116 154 Z"/>
  <!-- spine -->
  <rect class="spine" x="252" y="136" width="8" height="240" rx="4"/>
  <!-- rising star above the book -->
  <path class="star" d="M256 62 L271 96 L308 100 L281 125 L288 161 L256 143 L224 161 L231 125 L204 100 L241 96 Z"/>
</svg>
